# ===================================================================
# IRONCORE — Smart Gym Management System
# Application Configuration
# ===================================================================

server.port=8080
spring.application.name=ironcore-gym

# Active Profiles: default provides seamless zero-friction local run with H2 (MySQL Mode)
# Switch to 'mysql' by passing --spring.profiles.active=mysql or editing below
spring.profiles.active=default

# -------------------------------------------------------------------
# Datasource Configuration (Default: H2 in MySQL Compatibility Mode)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/ironcore_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Database platform auto-detected by Hibernate 6
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Developer H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# Thymeleaf & Web
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.web.resources.static-locations=classpath:/static/

# -------------------------------------------------------------------
# File Upload Configuration
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# IRONCORE Custom Brand Settings
# -------------------------------------------------------------------
ironcore.app.name=IRONCORE
ironcore.app.subtitle=Smart Gym Management System
ironcore.app.currency=₹
ironcore.app.version=1.0.0
