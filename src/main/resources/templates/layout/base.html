<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">IRONCORE — Smart Gym Management System</title>
    
    <!-- Design System Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom IRONCORE Stylesheet -->
    <link rel="stylesheet" th:href="@{/css/ironcore.css}">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation Fragment -->
        <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

        <!-- Main Content Area -->
        <div class="app-main">
            <!-- Header Bar Fragment -->
            <header th:replace="~{layout/navbar :: navbar}"></header>

            <!-- Alerts Banner -->
            <div class="app-content">
                <div th:if="${successMessage}" class="iron-alert success">
                    <i data-lucide="check-circle-2" style="width: 18px; height: 18px;"></i>
                    <span th:text="${successMessage}">Operation successful!</span>
                </div>
                <div th:if="${errorMessage}" class="iron-alert error">
                    <i data-lucide="alert-triangle" style="width: 18px; height: 18px;"></i>
                    <span th:text="${errorMessage}">An error occurred.</span>
                </div>

                <!-- Page Injected Content -->
                <main th:insert="${content}"></main>
            </div>
        </div>
    </div>

    <!-- Quick Check-in Modal -->
    <div id="quickCheckinModal" class="iron-modal-backdrop">
        <div class="iron-modal-content">
            <div class="modal-header-row">
                <div class="iron-card-title">
                    <i data-lucide="check-circle" style="color: var(--lime); width: 22px; height: 22px;"></i>
                    Quick Member Check-In
                </div>
                <button type="button" class="btn-close-modal" onclick="closeModal('quickCheckinModal')">
                    <i data-lucide="x" style="width: 20px; height: 20px;"></i>
                </button>
            </div>
            <form th:action="@{/attendance/checkin}" method="post">
                <div class="form-group">
                    <label class="form-label">Scan or Enter Member Code / Email</label>
                    <input type="text" name="memberCode" class="form-control-iron" placeholder="e.g. IC-M-1001 or alex.mercer@gmail.com" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Notes (Optional)</label>
                    <input type="text" name="notes" class="form-control-iron" placeholder="e.g. Morning cardio & core">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn-iron-secondary" onclick="closeModal('quickCheckinModal')">Cancel</button>
                    <button type="submit" class="btn-iron-primary">
                        <i data-lucide="log-in" style="width: 16px; height: 16px;"></i> Verify & Check In
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core Scripts -->
    <script th:src="@{/js/ironcore.js}"></script>
    <script th:src="@{/js/charts.js}"></script>
</body>
</html>
