<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Membership Plans — IRONCORE</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; flex-wrap: wrap; gap: 14px;">
            <div>
                <h1 style="font-size: 28px; font-weight: 800;">Membership Tiers & Plans</h1>
                <p style="color: var(--text-muted); font-size: 14px;">Configure subscription tiers, durations, pricing, and premium features.</p>
            </div>
            <button type="button" class="btn-iron-primary" onclick="openModal('createPlanModal')">
                <i data-lucide="plus-circle" style="width: 16px; height: 16px;"></i>
                <span>Create New Plan</span>
            </button>
        </div>

        <!-- Plans Grid -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div th:each="plan : ${plans}" class="iron-card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                        <span class="mono-font" style="font-size: 11px; color: var(--lime); font-weight: 700;" th:text="${plan.planCode}">PLAN-PLAT-A</span>
                        <span class="status-pill" th:classappend="${plan.active ? 'active' : 'inactive'}" th:text="${plan.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span>
                    </div>

                    <h3 style="font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 6px;" th:text="${plan.name}">Platinum Titan Annual</h3>
                    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; min-height: 38px;" th:text="${plan.description}">Elite all-inclusive membership.</p>

                    <div style="margin-bottom: 18px;">
                        <div style="display: flex; align-items: baseline; gap: 4px;">
                            <span style="font-size: 18px; color: var(--lime); font-weight: 700;">₹</span>
                            <span style="font-size: 32px; font-weight: 900; color: #fff; font-family: 'Outfit', sans-serif;" th:text="${#numbers.formatDecimal(plan.price, 1, 'COMMA', 0, 'POINT')}">15,999</span>
                            <span style="color: var(--text-muted); font-size: 13px;" th:text="' / ' + ${plan.durationDays} + ' days'"> / 365 days</span>
                        </div>
                    </div>

                    <!-- Features List -->
                    <div style="border-top: 1px solid var(--border-subtle); padding-top: 14px; margin-bottom: 20px;">
                        <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Included Features</div>
                        <ul style="list-style: none; font-size: 13px; color: var(--text-secondary);">
                            <li th:each="feature : ${#strings.arraySplit(plan.features, ',')}" style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                                <i data-lucide="check" style="width: 14px; height: 14px; color: var(--lime); flex-shrink: 0;"></i>
                                <span th:text="${feature}">Full Gym Access</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <div style="border-top: 1px solid var(--border-subtle); padding-top: 14px; display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 12px; color: var(--text-muted);" th:text="${plan.durationDays} + ' Days Validity'">365 Days</span>
                    <a th:href="@{/members/new(planId=${plan.id})}" class="btn-iron-secondary" style="font-size: 12px; padding: 6px 14px;">Assign Member</a>
                </div>
            </div>
        </div>

        <!-- Create Plan Modal -->
        <div id="createPlanModal" class="iron-modal-backdrop">
            <div class="iron-modal-content">
                <div class="modal-header-row">
                    <div class="iron-card-title">
                        <i data-lucide="award" style="color: var(--lime); width: 22px; height: 22px;"></i>
                        Create Membership Tier
                    </div>
                    <button type="button" class="btn-close-modal" onclick="closeModal('createPlanModal')">
                        <i data-lucide="x" style="width: 20px; height: 20px;"></i>
                    </button>
                </div>
                <form th:action="@{/plans/create}" method="post">
                    <div class="form-group">
                        <label class="form-label">Plan Name *</label>
                        <input type="text" name="name" class="form-control-iron" placeholder="e.g. Diamond Unlimited Semi-Annual" required>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                        <div class="form-group">
                            <label class="form-label">Price (₹) *</label>
                            <input type="number" step="0.01" name="price" class="form-control-iron" placeholder="7999.00" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Duration (Days) *</label>
                            <input type="number" name="durationDays" class="form-control-iron" placeholder="180" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Plan Description</label>
                        <textarea name="description" class="form-control-iron" rows="2" placeholder="Brief marketing summary of tier privileges"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Features (Comma-separated)</label>
                        <textarea name="features" class="form-control-iron" rows="3" placeholder="24/7 Access,Sauna & Steam,1 InBody Scan/Mo,VIP Locker,Guest Passes"></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                        <button type="button" class="btn-iron-secondary" onclick="closeModal('createPlanModal')">Cancel</button>
                        <button type="submit" class="btn-iron-primary">Create Plan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
