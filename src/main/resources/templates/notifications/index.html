<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>System Alerts & Notifications — IRONCORE</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Header -->
        <div style="margin-bottom: 24px;">
            <h1 style="font-size: 28px; font-weight: 800;">System Alerts & Notifications</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Operational event stream, membership warnings, and financial updates.</p>
        </div>

        <div class="iron-card" style="max-width: 900px;">
            <div class="iron-card-header">
                <div class="iron-card-title">
                    <i data-lucide="bell" style="width: 18px; height: 18px; color: var(--lime);"></i>
                    Notification Feed
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div th:each="n : ${notifications}" style="display: flex; align-items: flex-start; gap: 14px; padding: 16px; background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);">
                    <div style="width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"
                         th:classappend="${n.type == 'WELCOME' ? 'metric-icon-wrap lime' : (n.type == 'MEMBERSHIP_EXPIRY' ? 'metric-icon-wrap amber' : 'metric-icon-wrap cyan')}">
                        <i data-lucide="bell" style="width: 16px; height: 16px;"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                            <h4 style="font-size: 14.5px; font-weight: 700; color: #fff;" th:text="${n.title}">Notification Title</h4>
                            <span style="font-size: 11px; color: var(--text-muted);" th:text="${#temporals.format(n.createdAt, 'dd MMM, hh:mm a')}">10 Oct, 09:30 AM</span>
                        </div>
                        <p style="font-size: 13px; color: var(--text-secondary); margin: 0;" th:text="${n.message}">Message details</p>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(notifications)}" style="text-align: center; color: var(--text-muted); padding: 40px;">
                    <i data-lucide="bell-off" style="width: 32px; height: 32px; margin-bottom: 8px; display: block; margin-left: auto; margin-right: auto;"></i>
                    No notifications in the system log.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
